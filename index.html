<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Agenda The Beauty Space</title>
<meta name="description" content="Agenda pessoal, profissional, Laser Day e Clínica — The Beauty Space.">
<link rel="manifest" id="mf"><meta name="theme-color" content="#B5607E">
<link rel="icon" id="fav" type="image/svg+xml"><link rel="apple-touch-icon" id="ati">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Agenda TBS">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6F5;--bg-card:#FFFFFF;--ink:#2E2024;--ink-soft:#6E5A5E;--ink-faint:#85707A;--line:#F0E3E2;--line-strong:#E3CFD0;
--prof:#B5607E;--prof-ink:#8A4260;--prof-soft:#F8E8ED;--prof-line:#EBC9D4;
--pess:#6F8F6B;--pess-ink:#4D6B49;--pess-soft:#EAF1E7;--pess-line:#CFDFC9;
--gold:#B58A55;--gold-ink:#8A6636;--gold-soft:#F7ECDD;--gold-line:#E8D3B3;
--rotina:#5E7B5F;--rotina-soft:#E7EFE4;--atencao:#AD8A22;--atencao-soft:#F7EFD4;--importante:#BE6F27;--importante-soft:#F7E4CE;--urgente:#B0453F;--urgente-soft:#F5DEDB;--fatal:#7A2430;--fatal-soft:#F0D9DC;
--vprof:#6F8BA3;--vprof-soft:#E8EEF3;--vprof-line:#C9D6E1;--vprof-ink:#47627B;--clin:#8E78A8;--clin-soft:#EFEAF4;--clin-line:#D8CCE4;--clin-ink:#66527F;
--shadow-s:0 1px 2px rgba(60,30,40,.05),0 2px 8px rgba(60,30,40,.05);--shadow-m:0 4px 10px rgba(60,30,40,.08),0 10px 24px rgba(60,30,40,.08);--r-s:10px;--r-m:16px;--r-l:24px;
--font-display:'Fraunces',Georgia,serif;--font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:light;}
.eventitem.vida-laser{border-left-color:var(--prof)}.eventitem.vida-clinica{border-left-color:var(--clin)}.eventitem.vida-profissional{border-left-color:var(--vprof)}
.dot.vida-laser{background:var(--prof)}.dot.vida-clinica{background:var(--clin)}.dot.vida-profissional{background:var(--vprof)}
.filterchip.on.f-laser{background:var(--prof-soft);border-color:var(--prof-line);color:var(--prof-ink)}
.filterchip.on.f-clinica{background:var(--clin-soft);border-color:var(--clin-line);color:var(--clin-ink)}
.filterchip.on.f-profissional{background:var(--vprof-soft);border-color:var(--vprof-line);color:var(--vprof-ink)}
.filters{flex-wrap:wrap}
.segmented button.on{background:var(--prof);color:#fff}
.daycell.laser-on{background:var(--prof-soft);border-color:var(--prof-line)}
.daycell.selected,.daycell.selected.laser-on,.daycell.selected.feriado{background:var(--prof);border-color:var(--prof)}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:14px 0 8px;display:flex;align-items:center;gap:7px;color:var(--ink-soft)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn.wa{background:#25D366;color:#fff}.btn.wa svg{width:17px;height:17px}
.btn.on{background:var(--rotina-soft);border-color:var(--rotina);color:var(--rotina)}
.menu-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 4px;background:none;border:0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;color:var(--ink);text-align:left}
.menu-row small{display:block;font-size:12.5px;font-weight:400;color:var(--ink-soft)}
.menu-row svg{width:18px;height:18px;color:var(--ink-faint)}
.back{background:none;border:0;color:var(--prof);font-weight:600;font-size:14px;padding:0 0 10px;display:flex;align-items:center;gap:4px}
.pre{white-space:pre-wrap;font-size:13.5px;background:var(--prof-soft);border-radius:var(--r-s);padding:10px 12px;margin:8px 0}
.logo-clin{display:flex;justify-content:center;margin-bottom:6px}.logo-clin svg{width:86px;height:86px}
.svc-row{display:grid;grid-template-columns:1fr 92px 34px;gap:8px;margin-bottom:8px;align-items:center}
.ev-meta .chip{padding:2px 8px}
.card h3{font-size:16px;margin-bottom:6px}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom: calc(78px + env(safe-area-inset-bottom));
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink);}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:15px;}
a{color:inherit;}
::selection{background:var(--gold-soft);}

.container{max-width:560px; margin:0 auto; padding:0 16px;}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:rgba(251,246,245,.92);
  backdrop-filter:saturate(140%) blur(8px);
  border-bottom:1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.topbar-inner{
  max-width:560px; margin:0 auto; padding:14px 16px 12px;
  display:flex; align-items:center; gap:12px;
}
.brand-mark{width:34px; height:34px; border-radius:9px; flex-shrink:0;}
.brand-text{display:flex; flex-direction:column; line-height:1.1;}
.brand-text .wordmark{font-family:var(--font-display); font-weight:600; font-size:19px; letter-spacing:.2px;}
.brand-text .tagline{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
.topbar-date{margin-left:auto; text-align:right; font-size:12px; color:var(--ink-soft); text-transform:capitalize;}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:rgba(255,255,255,.96);
  backdrop-filter:saturate(140%) blur(10px);
  border-top:1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottomnav-inner{
  max-width:560px; margin:0 auto;
  display:grid; grid-template-columns:repeat(6,1fr);
}
.navbtn{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; padding:9px 2px 8px; background:none; border:none; color:var(--ink-faint);
}
.navbtn svg{width:21px; height:21px;}
.navbtn span{font-size:10px; font-weight:500; letter-spacing:.1px;}
.navbtn.active{color:var(--prof);}
.navbtn.active svg{filter:none;}

/* ---------- views ---------- */
.view{display:none; padding:16px 0 28px;}
.view.active{display:block;}

.card{
  background:var(--bg-card);
  border:1px solid var(--line);
  border-radius:var(--r-m);
  padding:16px;
  box-shadow:var(--shadow-s);
  margin-bottom:14px;
}
.card + .card{margin-top:0;}
.section-title{font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); font-weight:600; margin:22px 0 10px; font-family:var(--font-body);}
.section-title:first-child{margin-top:0;}

/* ---------- banners ---------- */
.banner{
  border-radius:var(--r-m); padding:14px 16px; margin-bottom:14px;
  display:flex; gap:12px; align-items:flex-start;
  border:1px solid var(--gold-line); background:var(--gold-soft);
}
.banner.recess{border-color:var(--prof-line); background:var(--prof-soft);}
.banner strong{display:block; margin-bottom:2px;}
.banner p{font-size:13.5px; color:var(--ink-soft);}
.banner .icon{width:20px; height:20px; flex-shrink:0; margin-top:1px; color:var(--gold-ink);}
.banner.recess .icon{color:var(--prof);}
.banner-actions{margin-top:8px; display:flex; gap:10px;}
.banner-dismiss{margin-left:auto; background:none; border:none; color:var(--ink-faint); padding:2px;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600;
  border:1px solid transparent; background:var(--prof); color:#fff;
  transition:transform .12s ease, opacity .15s ease;
}
.btn:active{transform:scale(.97);}
.btn.secondary{background:transparent; border-color:var(--line-strong); color:var(--ink);}
.btn.ghost{background:transparent; border-color:transparent; color:var(--prof); padding:8px 10px;}
.btn.danger{background:var(--fatal); color:#fff;}
.btn.small{padding:7px 13px; font-size:13px;}
.btn.block{width:100%;}
.btn:disabled{opacity:.5; pointer-events:none;}
.btn svg{width:16px; height:16px;}

.fab{
  position:fixed; right:18px; bottom:calc(90px + env(safe-area-inset-bottom)); z-index:25;
  width:54px; height:54px; border-radius:50%;
  background:var(--prof); color:#fff; border:none;
  box-shadow:var(--shadow-m);
  display:flex; align-items:center; justify-content:center;
}
.fab svg{width:24px; height:24px;}

/* ---------- form elements ---------- */
label.field{display:block; margin-bottom:14px;}
label.field .lbl{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
.input, select.input, textarea.input{
  width:100%; padding:10px 12px; border-radius:var(--r-s);
  border:1px solid var(--line-strong); background:#fff; color:var(--ink);
}
textarea.input{resize:vertical; min-height:64px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.check-row{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.check-row input[type=checkbox]{width:17px; height:17px; accent-color:var(--prof);}
.check-row .lbl{font-size:13.5px; font-weight:500;}
.hint{font-size:12px; color:var(--ink-faint); margin-top:4px;}

.segmented{display:flex; border:1px solid var(--line-strong); border-radius:999px; padding:3px; background:#fff;}
.segmented button{flex:1; border:none; background:none; padding:8px 6px; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--ink-soft);}
.segmented button.on.vida-profissional{background:var(--prof); color:#fff;}
.segmented button.on.vida-pessoal{background:var(--pess); color:#fff;}

.chip{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600;}
.chip.rotina{background:var(--rotina-soft); color:var(--rotina);}
.chip.atencao{background:var(--atencao-soft); color:var(--atencao);}
.chip.importante{background:var(--importante-soft); color:var(--importante);}
.chip.urgente{background:var(--urgente-soft); color:var(--urgente);}
.chip.fatal{background:var(--fatal-soft); color:var(--fatal);}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0;}
.dot.rotina{background:var(--rotina);} .dot.atencao{background:var(--atencao);}
.dot.importante{background:var(--importante);} .dot.urgente{background:var(--urgente);}
.dot.fatal{background:var(--fatal);}
.dot.vida-profissional{background:var(--prof);} .dot.vida-pessoal{background:var(--pess);}

.filterchip{border:1px solid var(--line-strong); background:#fff; border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.filterchip.on.f-profissional{background:var(--prof-soft); border-color:var(--prof-line); color:var(--prof-ink);}
.filterchip.on.f-pessoal{background:var(--pess-soft); border-color:var(--pess-line); color:var(--pess-ink);}
.filterchip.on.f-todos{background:var(--gold-soft); border-color:var(--gold-line); color:var(--gold-ink);}

/* ---------- toggle switch ---------- */
.switch{position:relative; width:44px; height:26px; flex-shrink:0;}
.switch input{opacity:0; width:100%; height:100%; margin:0; position:absolute; z-index:2; cursor:pointer;}
.switch .track{position:absolute; inset:0; background:var(--line-strong); border-radius:999px; transition:.15s;}
.switch .thumb{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:var(--shadow-s); transition:.15s;}
.switch input:checked + .track{background:var(--prof);}
.switch input:checked + .track + .thumb{transform:translateX(18px);}

/* ---------- calendar ---------- */
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.cal-nav .iconbtn{background:var(--bg-card); border:1px solid var(--line); border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
.cal-nav .iconbtn svg{width:18px; height:18px;}
.cal-nav h2{font-size:19px; text-transform:capitalize;}
.filters{display:flex; gap:8px; margin-bottom:14px;}
.weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--ink-faint); font-weight:600; margin-bottom:4px;}
.monthgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.daycell{
  aspect-ratio:1/1; border-radius:11px; border:1px solid transparent; background:var(--bg-card);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:5px 2px 4px;
  position:relative; border:1px solid var(--line);
}
.daycell.outmonth{opacity:.35;}
.daycell.today{border-color:var(--prof); border-width:1.5px;}
.daycell.selected{background:var(--prof); border-color:var(--prof);}
.daycell.selected .daynum{color:#fff;}
.daycell.feriado{background:var(--gold-soft);}
.daycell.suspensao{background:repeating-linear-gradient(135deg, #fff, #fff 5px, var(--line) 5px, var(--line) 6px);}
.daycell.selected.feriado, .daycell.selected.suspensao{background:var(--prof);}
.daynum{font-size:13px; font-weight:600;}
.dayindic{display:flex; gap:2px; margin-top:3px; flex-wrap:wrap; justify-content:center; min-height:6px;}
.dayindic .dot{width:5px; height:5px;}
.daycell.selected .dayindic .dot{background:#fff !important; opacity:.85;}
.day-urgent-bar{position:absolute; bottom:2px; left:14%; right:14%; height:2.5px; border-radius:2px; background:var(--fatal);}

.daydetail-head{display:flex; align-items:baseline; justify-content:space-between; margin:18px 0 10px;}
.daydetail-head h3{font-size:16px; text-transform:capitalize;}
.eventitem, .taskitem{
  display:flex; gap:10px; align-items:flex-start; padding:11px 12px; border-radius:var(--r-s);
  background:var(--bg-card); border:1px solid var(--line); border-left-width:4px; margin-bottom:8px;
}
.eventitem.vida-profissional{border-left-color:var(--prof);}
.eventitem.vida-pessoal{border-left-color:var(--pess);}
.eventitem .ev-main{flex:1; min-width:0;}
.eventitem .ev-title{font-weight:600; font-size:14.5px;}
.eventitem .ev-meta{font-size:12px; color:var(--ink-soft); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.eventitem .ev-actions{display:flex; gap:4px; flex-shrink:0;}
.iconbtn-flat{background:none; border:none; color:var(--ink-faint); padding:4px; border-radius:7px;}
.iconbtn-flat svg{width:16px; height:16px;}
.iconbtn-flat:active{background:var(--line);}
.empty-note{color:var(--ink-faint); font-size:13.5px; padding:14px 4px; text-align:center;}

/* ---------- modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(46,32,36,.42); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:var(--bg); width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
  border-radius:22px 22px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
}
.modal-handle{width:38px; height:4px; background:var(--line-strong); border-radius:99px; margin:0 auto 14px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:18px;}
.modal-close{background:var(--bg-card); border:1px solid var(--line); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
.modal-close svg{width:15px; height:15px;}
.modal-foot{display:flex; gap:10px; margin-top:6px;}
.modal-small .modal{max-width:420px; border-radius:22px; margin:auto;}
.modal-small.modal-backdrop{align-items:center; padding:20px;}
.collapse-toggle{background:none; border:none; color:var(--prof); font-weight:600; font-size:13px; padding:6px 0; display:flex; align-items:center; gap:5px;}
.collapse-body{display:none; padding-top:8px;}
.collapse-body.open{display:block;}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px);
  background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; font-size:13.5px;
  opacity:0; pointer-events:none; transition:.2s ease; z-index:60; max-width:88%; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- categories view ---------- */
.cat-header{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.cat-header .swatch{width:10px; height:10px; border-radius:50%;}
.cat-row{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line);}
.cat-row:last-child{border-bottom:none;}
.cat-row input.input{padding:7px 9px; font-size:14px;}
.cat-add{display:flex; gap:8px; margin-top:10px;}
.tarja-row{display:flex; align-items:center; gap:10px; padding:8px 0;}

/* ---------- holidays view ---------- */
.hol-month{font-size:12.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); font-weight:700; margin:16px 0 6px;}
.hol-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line);}
.hol-date{width:38px; text-align:center; flex-shrink:0;}
.hol-date .n{font-size:16px; font-weight:700; display:block; line-height:1.1;}
.hol-date .m{font-size:9.5px; color:var(--ink-faint); text-transform:uppercase;}
.hol-name{flex:1; font-size:13.5px;}
.hol-badge{font-size:10px; font-weight:700; padding:3px 8px; border-radius:99px; white-space:nowrap;}
.hol-badge.nacional{background:var(--prof-soft); color:var(--prof-ink);}
.hol-badge.estadual{background:var(--pess-soft); color:var(--pess-ink);}
.hol-badge.forense{background:var(--gold-soft); color:var(--gold-ink);}
.hol-badge.reduzido{background:var(--bg); color:var(--ink-soft); border:1px solid var(--line-strong);}
.hol-badge.informativo{background:var(--bg); color:var(--ink-faint); border:1px dashed var(--line-strong);}
.hol-badge.local{background:var(--urgente-soft); color:var(--urgente);}

/* ---------- misc ---------- */
.disclaimer{font-size:12px; color:var(--ink-faint); line-height:1.5; margin-top:10px;}
.settings-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);}
.settings-row:last-child{border-bottom:none;}
.settings-row .txt strong{display:block; font-size:14px;}
.settings-row .txt p{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
.filebtn{position:relative; overflow:hidden;}
.filebtn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important;}
}

</style>
</head>
<body>
<div id="app">
<header class="topbar"><div class="topbar-inner">
<svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#B5607E"/><rect x="14" y="19" width="36" height="31" rx="6" fill="#FBF6F5"/><path d="M14 28h36" stroke="#E7C3CD" stroke-width="2"/><path d="M23 14v9M41 14v9" stroke="#FBF6F5" stroke-width="3.2" stroke-linecap="round"/><path d="M32 31l2.3 5.7L40 39l-5.7 2.3L32 47l-2.3-5.7L24 39l5.7-2.3z" fill="#B5607E"/></svg>
<div class="brand-text"><span class="wordmark">Agenda</span><span class="tagline">The Beauty Space</span></div><div class="topbar-date" id="topbar-date"></div></div></header>
<div class="container" id="main"></div></div>
<button class="fab" id="fab" aria-label="Novo" data-a="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="bottomnav"><div class="bottomnav-inner" id="nav"></div></nav>
<div class="modal-backdrop" id="mb"><div class="modal" id="md"></div></div><div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),par=s=>new Date(s+'T12:00'),addD=(s,n)=>{const d=par(s);d.setDate(d.getDate()+n);return iso(d)},hoje=()=>iso(new Date()),br=s=>s.split('-').reverse().join('/'),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
